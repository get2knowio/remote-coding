[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "remo-cli"
version = "4.3.6"
description = "Remote development environment CLI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "InquirerPy>=0.3.4",
    # boto3 has two consumers: the CLI's own lazy `import boto3` in
    # providers/aws.py, AND the amazon.aws/community.aws Ansible collections,
    # which import it under ansible_playbook_python (pinned to this same
    # environment). It stays unconditional per FR-004 pending issue #94.
    "boto3",
    # hcloud is never imported anywhere in src/remo_cli/ — its real consumer
    # is the hetzner.hcloud Ansible collection (pinned >=6.7.0 in
    # ansible/requirements.yml), whose modules `import hcloud` under the
    # `ansible_python_interpreter: {{ ansible_playbook_python }}` set by
    # ansible/hetzner_site.yml and ansible/hetzner_teardown.yml — i.e. the
    # CLI's own Python environment. roles/hetzner_server/tasks/main.yml
    # pip-installs it as a fallback, but only on the create path; the
    # teardown and resize playbooks have no such preflight, so it must be
    # present up front. See issue #94.
    "hcloud",
    "ansible-core>=2.18.0,<2.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-mock",
    "ruff",
    "mypy",
    # Transport backing starlette's TestClient, which every tests/**/web
    # suite builds on. Starlette does not depend on it (the service itself
    # never makes HTTP client calls), so without this the web tests fail at
    # collection, not as assertions.
    #
    # NOT a misspelling of httpx: httpx2 is a real, separate pydantic-org
    # package (github.com/pydantic/httpx2). Starlette 1.3.1's testclient
    # tries `import httpx2 as httpx` first and falls back to `httpx` only if
    # httpx2 is absent.
    "httpx2",
]
web = [
    "fastapi",
    "uvicorn[standard]",
    "websockets",
    "pydantic>=2",
]

[project.scripts]
remo-cli = "remo_cli.cli.main:main"
remo = "remo_cli.cli.main:main"

[tool.uv]
# Resolver-side twin of the Dependabot cooldown in .github/dependabot.yml: a
# release must sit for 7 days before any `uv sync`/`uv lock` here will pick it
# up. Without this, a plain `uv sync` still pulls a just-published transitive
# dependency that Dependabot would have waited on.
exclude-newer = "7 days"

[tool.hatch.build.targets.wheel]
packages = ["src/remo_cli"]

[tool.hatch.build.targets.wheel.force-include]
"ansible" = "remo_cli/ansible"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src"]
line-length = 100

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
