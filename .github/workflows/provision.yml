name: Provision Server

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "yes" to confirm provisioning'
        required: true
        default: ''

permissions:
  contents: read

concurrency:
  group: provision-${{ github.ref }}
  cancel-in-progress: false  # Never cancel — would orphan half-provisioned cloud resources.

jobs:
  provision:
    name: Provision Remote Coding Server
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'yes'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install Ansible and dependencies
        run: |
          uv pip install --system ansible requests python-dateutil
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          echo "${{ secrets.SSH_PUBLIC_KEY }}" > ~/.ssh/id_rsa.pub
          chmod 600 ~/.ssh/id_rsa
          chmod 644 ~/.ssh/id_rsa.pub

      - name: Run provisioning playbook
        env:
          HETZNER_API_TOKEN: ${{ secrets.HETZNER_API_TOKEN }}
          ANSIBLE_HOST_KEY_CHECKING: 'false'
        run: |
          cd ansible
          ansible-playbook hetzner_site.yml
