name: dev-build

# Build an installable wheel for pre-release testing. Two modes, and the
# difference between them is what the artifact may later become:
#
#  1. DEV BUILD (no `version` input) -> `X.Y.Z.dev<run>+g<sha>`.
#     The PEP 440 *local* segment makes it un-uploadable to PyPI by
#     construction, so it can never leak — and it can never be promoted either.
#     Validation only. Uploaded as a run artifact (needs `gh` to fetch).
#
#  2. RELEASE CANDIDATE (`version=X.Y.ZrcN`) -> that version, verbatim.
#     NO local segment, because a promotable artifact is the entire point: if
#     the RC proves out it is published to PyPI as-is rather than rebuilt
#     (constitution IX, "Promotion MUST publish the identical artifact").
#     Resolvers skip pre-release versions by default, so it is still invisible
#     to a plain `uv tool install remo-cli`.
#     With `prerelease: true` it is also attached to a GitHub pre-release, so
#     other machines can install it by URL with no `gh` auth at all.
#
# NOTHING here publishes to PyPI. The pre-release tag is `rc-*`, which
# release.yml (`tags: v*`) deliberately does not match.
#
# With `image=true` (requires `prerelease=true`) it also publishes the remo-web
# container image for the same version via rc-image.yml —
# `ghcr.io/<owner>/remo-web:<version>`, never `latest` — so a Compose-based
# deployment can pin the pre-release by digest. See rc-image.yml.
#
# Trigger:
#   gh workflow run dev-build.yml                                    # dev build
#   gh workflow run dev-build.yml -f version=4.4.0rc1                # RC, artifact only
#   gh workflow run dev-build.yml -f version=4.4.0rc1 -f prerelease=true
#   gh workflow run dev-build.yml -f version=4.4.0rc1 -f prerelease=true -f image=true
#
# Install on any machine:
#   # run artifact (needs gh auth)
#   gh run download <run-id> -R get2knowio/remo -n remo-wheel -D ./dl
#   uv tool install --force "remo-cli[web] @ ./dl/remo_cli-<version>-py3-none-any.whl"
#   # GitHub pre-release (no gh auth)
#   uv tool install --force "remo-cli[web] @ https://github.com/get2knowio/remo/releases/download/rc-<version>/remo_cli-<version>-py3-none-any.whl"
#   # revert to the released build
#   uv tool install remo-cli --force

on:
  workflow_dispatch:
    inputs:
      version:
        description: "PEP 440 pre-release version to stamp (e.g. 4.4.0rc1, 4.4.0.dev5). Blank = auto dev version, which additionally gets a +g<sha> local segment. A final version (4.4.0) is refused — those come from the release process."
        required: false
        default: ""
      prerelease:
        description: "Also attach the wheel to a GitHub pre-release (tag rc-<version>) so it installs by URL without gh auth. Requires an explicit version. Never publishes to PyPI."
        type: boolean
        required: false
        default: false
      image:
        description: "Also publish the remo-web container image ghcr.io/<owner>/remo-web:<version> for this pre-release (rc-image.yml). Requires prerelease=true. Never moves `latest`."
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: dev-build-${{ github.ref }}
  cancel-in-progress: false  # Never cancel — someone is waiting on this run's wheel artifact.

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Compute version
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
          WANT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse --short HEAD)
          if [ -n "$INPUT_VERSION" ]; then
            # An explicit version must be a PEP 440 pre-release or dev release.
            # Refusing a final version here is what keeps this workflow from
            # ever producing something that looks like a real release.
            if ! printf '%s' "$INPUT_VERSION" \
              | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+|\.dev[0-9]+)$'; then
              echo "::error::'$INPUT_VERSION' is not a PEP 440 pre-release/dev version (expected e.g. 4.4.0rc1, 4.4.0b2, 4.4.0.dev5). Final versions are cut by release-please + release.yml, not here."
              exit 1
            fi
            # Verbatim: no local segment, so this artifact stays promotable.
            VERSION="$INPUT_VERSION"
          else
            if [ "$WANT_PRERELEASE" = "true" ]; then
              echo "::error::prerelease=true needs an explicit version. An auto dev build carries a +g<sha> local segment, which PyPI rejects — it can never be promoted, so publishing it as a release asset would be misleading."
              exit 1
            fi
            CORE=$(grep -m1 '^version = ' pyproject.toml \
              | sed -E 's/version = "([0-9]+\.[0-9]+\.[0-9]+).*"/\1/')
            # Local segment: unique, and un-uploadable to PyPI by construction.
            VERSION="${CORE}.dev${GITHUB_RUN_NUMBER}+g${SHA}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - name: Stamp version into pyproject.toml
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          sed -i -E "0,/^version = \".*\"/s//version = \"${VERSION}\"/" pyproject.toml
          grep -m1 '^version = ' pyproject.toml

      - name: Build wheel + sdist
        run: uv build

      - name: Upload artifact
        # NOTE: SHA-pin to match the repo's action-pinning convention once the
        # v4 commit SHA is available (e.g. `@<sha> # v4`).
        uses: actions/upload-artifact@v7
        with:
          name: remo-wheel
          path: dist/*
          retention-days: 30
          if-no-files-found: error

  prerelease:
    # Attaches the SAME artifact the build job produced to a GitHub pre-release
    # — it does not rebuild. Separate job so `contents: write` is scoped to the
    # step that needs it and the common dev-build path stays read-only.
    needs: build
    if: ${{ inputs.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download the built artifact
        # NOTE: SHA-pin alongside upload-artifact above.
        uses: actions/download-artifact@v6
        with:
          name: remo-wheel
          path: dist

      - name: Create GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          TAG="rc-${VERSION}"
          # Hard stop: a v-prefixed tag would trigger release.yml, which
          # publishes to PyPI and GHCR. This workflow must never do that.
          case "$TAG" in
            v*) echo "::error::refusing to create tag '$TAG' — it would trigger release.yml"; exit 1 ;;
          esac
          ls -la dist/
          WHEEL_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${TAG}/remo_cli-${VERSION}-py3-none-any.whl"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # Quoted heredoc: the notes contain backticks, which an unquoted one
          # would run as command substitution. Placeholders are filled in after.
          cat > /tmp/notes.md <<'NOTES'
          Pre-release build for testing. **Not published to PyPI.**

          Install on any machine (no `gh` auth needed):

          ```bash
          uv tool install --force "remo-cli[web] @ __WHEEL_URL__"
          ```

          Revert to the released build:

          ```bash
          uv tool install remo-cli --force
          ```

          Built from `__SHA__` by [this run](__RUN_URL__).
          NOTES
          sed -i \
            -e "s|__WHEEL_URL__|${WHEEL_URL}|" \
            -e "s|__SHA__|${GITHUB_SHA}|" \
            -e "s|__RUN_URL__|${RUN_URL}|" \
            /tmp/notes.md
          gh release create "$TAG" dist/* \
            --title "Release candidate $VERSION" \
            --prerelease \
            --notes-file /tmp/notes.md
          echo "Created pre-release $TAG"

  image:
    # Publishes the container image for the same pre-release version, from the
    # same commit the wheel was built from. Delegated to rc-image.yml so the
    # image can also be (re)built on its own for an existing `rc-*` tag.
    needs: [build, prerelease]
    if: ${{ inputs.prerelease && inputs.image }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/rc-image.yml
    with:
      version: ${{ needs.build.outputs.version }}
      ref: ${{ github.sha }}
